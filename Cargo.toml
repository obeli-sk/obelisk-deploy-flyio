[workspace]
resolver = "2"
members = [
    "workflow/deployer-workflow",
    "webhook/healthcheck",
]

[workspace.package]
version = "0.1.0"
license = "MIT"
authors = ["Project Developers"]
edition = "2024"
repository = "TBD"
rust-version = "1.90.0"

[workspace.dependencies]
anyhow = "1.0"
assert_matches = "1.5.0"
base64 = "0.22.1"
const_format = "0.2.35"
derive_more = { version = "2.1.1", features = ["debug"] }
hashbrown = "0.16.1"
insta = "1.47.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
toml = "1.1"
wit-bindgen = "0.54.0"
wit-bindgen-rust = "0.54.0"
wit-parser = "0.246.2"
wstd = "0.6.5"

[profile.release]
opt-level = "z"
lto = true
overflow-checks = true

[profile.release_webhook]
inherits = "release"
strip = "debuginfo"

[profile.release_workflow]
inherits = "release"
debug = "line-tables-only"
